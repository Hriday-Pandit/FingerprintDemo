<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Fingerprint Logic Tester</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        
        .finger-selector {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            text-align: left;
        }
        select {
            width: 100%;
            padding: 10px;
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-reg { background-color: #2563eb; color: white; }
        .btn-ver { background-color: #059669; color: white; }

        #db-box {
            background-color: #020617;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #38bdf8;
            text-align: left;
            word-break: break-all;
            margin-top: 15px;
            display: none;
            border: 1px solid #1e293b;
        }

        #status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            line-height: 1.4;
        }
        .success { background-color: #064e3b; color: #6ee7b7; border: 1px solid #065f46; display: block; }
        .error { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Biometric Logic Simulator</h2>
    <p>Pure Website-Level Fingerprint Matcher (No Mobile Pop-up)</p>

    <!-- उंगली चुनने का पैनल -->
    <div class="finger-selector">
        <label for="fingerType">सेंसर पर कौन सी उंगली रख रहे हैं?</label>
        <select id="fingerType">
            <option value="FINGER_THUMB_R_9832">Right Thumb (दायाँ अंगूठा)</option>
            <option value="FINGER_INDEX_R_4412">Right Index (दायाँ तर्जनी)</option>
            <option value="FINGER_THUMB_L_1102">Left Thumb (बायाँ अंगूठा)</option>
        </select>
    </div>

    <!-- ऐक्शन बटन्स -->
    <div class="btn-panel">
        <button class="btn btn-reg" onclick="registerProcess()">1. Register Finger</button>
        <button class="btn btn-ver" onclick="verifyProcess()">2. Verify & Match</button>
    </div>

    <!-- JS डेटाबेस बॉक्स -->
    <div id="db-box"></div>

    <!-- रिजल्ट बॉक्स -->
    <div id="status-box"></div>
</div>

<script>
    // यह डेटाबेस की तरह काम करेगा जो जावास्क्रिप्ट की मेमोरी में रहेगा
    let websiteDatabase = {
        savedFingerId: null,
        savedFingerName: null
    };

    function updateStatus(message, isSuccess) {
        const box = document.getElementById('status-box');
        box.innerText = message;
        box.className = isSuccess ? 'success' : 'error';
    }

    // 1. रजिस्ट्रेशन लॉजिक
    function registerProcess() {
        const selectedFinger = document.getElementById('fingerType');
        const fingerValue = selectedFinger.value; // उंगली की यूनिक आईडी
        const fingerName = selectedFinger.options[selectedFinger.selectedIndex].text; // उंगली का नाम

        // डेटाबेस में सेव करना
        websiteDatabase.savedFingerId = btoa(fingerValue + "_SECURE_KEY"); // डमी टोकन जनरेशन
        websiteDatabase.savedFingerName = fingerName;

        // स्क्रीन पर दिखाना कि क्या सेव हुआ
        const dbBox = document.getElementById('db-box');
        dbBox.innerHTML = `<strong>Website DB (Saved Data):</strong><br>ID: ${websiteDatabase.savedFingerId}<br>Finger: ${websiteDatabase.savedFingerName}`;
        dbBox.style.display = 'block';

        updateStatus(`✅ ${fingerName} रजिस्टर्ड हो गया है और उसकी यूनिक ID वेबसाइट में सेव कर ली गई है!`, true);
    }

    // 2. वेरिफिकेशन लॉजिक
    function verifyProcess() {
        const selectedFinger = document.getElementById('fingerType');
        const currentFingerValue = selectedFinger.value;
        const currentFingerName = selectedFinger.options[selectedFinger.selectedIndex].text;

        // चेक करना कि पहले कुछ रजिस्टर हुआ भी है या नहीं
        if (!websiteDatabase.savedFingerId) {
            updateStatus("❌ एरर: पहले बटन 1 से कोई उंगली रजिस्टर करें!", false);
            return;
        }

        // वर्तमान उंगली का टोकन बनाना
        const currentFingerToken = btoa(currentFingerValue + "_SECURE_KEY");

        // जावास्क्रिप्ट मिलान (True Matching)
        if (currentFingerToken === websiteDatabase.savedFingerId) {
            updateStatus(`🎉 MATCH SUCCESSFUL!\nवेरिफिकेशन सफल। आपने वही उंगली (${currentFingerName}) लगाई है जो रजिस्टर हुई थी। Access Granted.`, true);
        } else {
            updateStatus(`⚠️ MISMATCH DETECTED!\nAccess Denied! आपने अभी ${currentFingerName} लगाई है, जबकि वेबसाइट में ${websiteDatabase.savedFingerName} रजिस्टर्ड है।`, false);
        }
    }
</script>

</body>
</html>
