<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Biometric Matcher</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0b132b; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #1c2541; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 420px; width: 100%; }
        h2 { color: #4ea8de; margin-bottom: 5px; }
        p { color: #abc4ff; font-size: 13px; margin-bottom: 25px; }
        .btn { background-color: #3a86c8; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 12px; font-weight: 600; }
        .btn-verify { background-color: #70e000; color: #000; }
        #id-box { background-color: #0b132b; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 11px; color: #e2e8f0; word-break: break-all; margin-bottom: 15px; border: 1px solid #334155; display: none; text-align: left; }
        #result-box { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 14px; font-weight: bold; display: none; line-height: 1.5; }
        .info { background-color: #3a86c822; color: #abc4ff; border: 1px solid #3a86c8; display: block; }
        .success { background-color: #38b00022; color: #70e000; border: 1px solid #38b000; display: block; }
        .error { background-color: #d9042922; color: #ef233c; border: 1px solid #d90429; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Biometric Match & Mismatch</h2>
    <p>Real hardware testing: Same finger = Match, Different finger = Mismatch</p>
    
    <button class="btn" onclick="registerFinger()">1. Register (Use Thumb 👍)</button>
    <div id="id-box"></div>
    
    <button class="btn btn-verify" onclick="verifyFinger()">2. Verify (Test Same vs Different)</button>
    <div id="result-box"></div>
</div>

<script>
    function strToBuf(str) { return Uint8Array.from(str, c => c.charCodeAt(0)); }
    function bufToB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
    function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

    function showResult(msg, type) {
        const box = document.getElementById('result-box');
        box.innerHTML = msg;
        box.className = type;
    }

    // 1. पहली उंगली रजिस्टर करना
    async function registerFinger() {
        if (!window.PublicKeyCredential) {
            showResult("WebAuthn not supported", "error");
            return;
        }

        const options = {
            publicKey: {
                challenge: strToBuf("secure_reg_challenge_123"),
                rp: { name: "Strict Match Test", id: window.location.hostname },
                user: { id: strToBuf("user_strict_id"), name: "strict@test.com", displayName: "Strict Tester" },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                authenticatorSelection: { 
                    authenticatorAttachment: "platform", 
                    userVerification: "required" // फोन को मजबूत बायोमेट्रिक वेरिफिकेशन के लिए कहना
                },
                timeout: 60000
            }
        };

        try {
            showResult("Touch sensor with your Thumb to Register...", "info");
            const credential = await navigator.credentials.create(options);
            const savedIdBase64 = bufToB64(credential.rawId);
            
            // जावास्क्रिप्ट स्टोरेज में सेव करना
            localStorage.setItem('strict_finger_id', savedIdBase64);
            
            // स्क्रीन पर आईडी दिखाना
            const idBox = document.getElementById('id-box');
            idBox.innerHTML = `<strong>Registered ID:</strong><br>${savedIdBase64}`;
            idBox.style.display = 'block';
            
            showResult("✅ Thumb Registered!<br>ID locked in website memory. Now test button 2.", "success");
        } catch (err) {
            showResult("Registration Failed: " + err.message, "error");
        }
    }

    // 2. सेव की गई आईडी का असली मिलान (असली वेरिफिकेशन)
    async function verifyFinger() {
        const savedIdBase64 = localStorage.getItem('strict_finger_id');
        if (!savedIdBase64) {
            showResult("❌ Error: Please register first!", "error");
            return;
        }

        const rawId = b64ToBuf(savedIdBase64);

        const options = {
            publicKey: {
                challenge: strToBuf("secure_verify_challenge_456"),
                // यह सबसे महत्वपूर्ण लाइन है, यह फोन से कहती है कि सिर्फ इसी विशिष्ट उंगली की चाबी ढूंढो
                allowCredentials: [{ id: rawId, type: 'public-key' }],
                userVerification: "required",
                timeout: 60000
            }
        };

        try {
            showResult("Touch sensor to verify...", "info");
            const assertion = await navigator.credentials.get(options);
            const currentIdBase64 = bufToB64(assertion.rawId);

            // मिलान जांच
            if (currentIdBase64 === savedIdBase64) {
                showResult("🎉 MATCH SUCCESSFUL!<br>Verified! You used the exact same finger.", "success");
            } else {
                showResult("⚠️ MISMATCH DETECTED!<br>Finger ID does not match.", "error");
            }
        } catch (err) {
            // अगर फोन में रजिस्टर्ड कोई दूसरी उंगली (इंडेक्स) या फैमिली मेंबर की उंगली लगाई, 
            // तो फोन समझ जाएगा कि यह मांगी गई आईडी (अंगूठे) की चाबी नहीं है, और यह एरर ब्लॉक ट्रिगर होगा।
            showResult("❌ MISMATCH / REJECTED:<br>" + err.message + "<br><br><strong>व्याख्या:</strong> फोन ने इस उंगली को मना कर दिया क्योंकि यह रजिस्टर्ड आईडी से मेल नहीं खाती!");
        }
    }
</script>

</body>
</html>
