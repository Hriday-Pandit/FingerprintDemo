<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Match & Mismatch Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn-verify { background-color: #059669; }
        .btn-verify:hover { background-color: #047857; }
        #status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            display: none;
        }
        .info { background-color: #1e1b4b; color: #a5b4fc; border: 1px solid #312e81; display: block; }
        .success { background-color: #064e3b; color: #6ee7b7; border: 1px solid #065f46; display: block; }
        .error { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Biometric Matcher</h2>
    <p>Test Same vs Different Fingerprints</p>
    
    <button class="btn" onclick="registerFinger()">1. Register Fingerprint A</button>
    <button class="btn btn-verify" onclick="verifyFinger()">2. Verify & Match Test</button>
    
    <div id="status-box"></div>
</div>

<script>
    // यूटिलिटी फंक्शन्स
    function strToBuffer(str) { return Uint8Array.from(str, c => c.charCodeAt(0)); }
    function bufferToStr(buf) { return String.fromCharCode.apply(null, new Uint8Array(buf)); }

    function updateStatus(message, type) {
        const box = document.getElementById('status-box');
        box.innerText = message;
        box.className = type;
    }

    // 1. रजिस्ट्रेशन (उंगली A को रजिस्टर करें)
    async function registerFinger() {
        if (!window.PublicKeyCredential) {
            updateStatus("Browser doesn't support WebAuthn", "error");
            return;
        }

        const options = {
            publicKey: {
                challenge: strToBuffer("registration_challenge_123"),
                rp: { name: "Match Test", id: window.location.hostname },
                user: { id: strToBuffer("user_test_id"), name: "finger@test.com", displayName: "Tester" },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                timeout: 60000
            }
        };

        try {
            updateStatus("Touch Sensor with Finger A to Register...", "info");
            const credential = await navigator.credentials.create(options);
            
            // क्रेडेंशियल आईडी को SessionStorage में सेव करें
            const base64Id = btoa(bufferToStr(credential.rawId));
            sessionStorage.setItem('registered_finger_id', base64Id);
            
            updateStatus("✅ Fingerprint A Registered Successfully!\nNow test with Same or Different finger using button 2.", "success");
        } catch (err) {
            updateStatus("Registration Failed: " + err.message, "error");
        }
    }

    // 2. वेरिफिकेशन (मैच / मिसमैच टेस्ट)
    async function verifyFinger() {
        const savedId = sessionStorage.getItem('registered_finger_id');
        if (!savedId) {
            updateStatus("❌ Error: Register Finger A first!", "error");
            return;
        }

        const rawId = strToBuffer(atob(savedId));

        const options = {
            publicKey: {
                challenge: strToBuffer("verification_challenge_456"),
                allowCredentials: [{ id: rawId, type: 'public-key' }],
                userVerification: "required",
                timeout: 60000
            }
        };

        try {
            updateStatus("Touch Sensor to Verify...", "info");
            const assertion = await navigator.credentials.get(options);
            
            // क्रेडेंशियल से आई आईडी को मैच करना
            const currentId = btoa(bufferToStr(assertion.rawId));
            
            if (currentId === savedId) {
                updateStatus("🎉 MATCH SUCCESSFUL!\nYou used the exact same finger (Finger A). Access Granted.", "success");
            } else {
                // तकनीकी रूप से ब्राउज़र/OS इस ब्लॉक में आने से पहले ही ब्लॉक कर देता है, 
                // लेकिन अगर मल्टीपल फिंगर्स अलाउड हैं तो JS मिसमैच पकड़ेगा।
                updateStatus("⚠️ MISMATCH DETECTED!\nThis finger does not match the registered Finger A. Access Denied.", "error");
            }
        } catch (err) {
            // अगर फोन में रजिस्टर्ड दूसरी उंगली लगाई या गलत उंगली लगाई तो OS एरर देगा
            updateStatus("❌ Verification Failed / Not Recognized:\n" + err.message + "\n(Did you use a different or unregistered finger?)", "error");
        }
    }
</script>

</body>
</html>
