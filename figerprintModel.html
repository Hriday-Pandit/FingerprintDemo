<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Fingerprint Scan Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0e1118;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1c2333;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #2d3748;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        h2 { margin-bottom: 5px; color: #4ade80; }
        p { color: #a0aec0; font-size: 14px; margin-bottom: 30px; }
        .btn-retry {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: none;
            margin: 20px auto 0;
        }
        #output {
            text-align: left;
            background: #0f141c;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            color: #38bdf8;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 200px;
            border: 1px solid #232d3f;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">👆</div>
    <h2 id="title">Scanning...</h2>
    <p id="status">Starting fingerprint hardware, please wait...</p>
    
    <div id="output"></div>
    <button id="retryBtn" class="btn-retry" onclick="triggerScan()">Scan Again</button>
</div>

<script>
    // स्ट्रिंग को एरे बफर में बदलने का यूटिलिटी फंक्शन
    function strToBuffer(str) {
        return Uint8Array.from(str, c => c.charCodeAt(0));
    }

    // फिंगरप्रिंट ट्रिगर करने का मुख्य फंक्शन
    async function triggerScan() {
        const statusText = document.getElementById('status');
        const titleText = document.getElementById('title');
        const outputDiv = document.getElementById('output');
        const retryBtn = document.getElementById('retryBtn');

        titleText.innerText = "Scanning...";
        titleText.style.color = "#3b82f6";
        statusText.innerText = "Please touch your fingerprint sensor now.";
        outputDiv.style.display = "none";
        retryBtn.style.display = "none";

        if (!window.PublicKeyCredential) {
            titleText.innerText = "Not Supported";
            titleText.style.color = "#ef4444";
            statusText.innerText = "Your browser or device does not support Biometric APIs.";
            return;
        }

        // ब्राउज़र को स्कैन एक्टिवेट करने के लिए डमी डेटा भेजना जरूरी है
        const dummyScanOptions = {
            publicKey: {
                challenge: strToBuffer("temporary_challenge_for_direct_scan"),
                rp: { name: "Instant Scan Demo", id: window.location.hostname },
                user: {
                    id: strToBuffer("temp_user_id"),
                    name: "tester@scan.com",
                    displayName: "Quick Tester"
                },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                authenticatorSelection: {
                    authenticatorAttachment: "platform",
                    userVerification: "required"
                },
                timeout: 30000
            }
        };

        try {
            // हार्डवेयर स्कैनर को चालू करना
            const credential = await navigator.credentials.create(dummyScanOptions);
            
            // स्कैन पूरा होने पर
            titleText.innerText = "Scan Successful!";
            titleText.style.color = "#4ade80";
            statusText.innerText = "Fingerprint detected. Raw data received from hardware:";
            
            // डेटा को स्क्रीन पर दिखाना
            const rawDataInfo = {
                id: credential.id,
                type: credential.type,
                rawIdLength: credential.rawId.byteLength,
                algorithmUsed: "ES256 (Elliptic Curve)"
            };

            outputDiv.innerText = JSON.stringify(rawDataInfo, null, 4);
            outputDiv.style.display = "block";
            retryBtn.style.display = "block";

        } catch (error) {
            titleText.innerText = "Scan Cancelled / Failed";
            titleText.style.color = "#ef4444";
            statusText.innerText = "Error: " + error.message;
            retryBtn.style.display = "block";
        }
    }

    // जैसे ही पेज लोड हो, ऑटोमैटिक स्कैन विंडो खुल जाए
    window.onload = function() {
        // ब्राउज़र यूजर इंटरेक्शन मांग सकता है, इसलिए 1 सेकंड का डिले दिया है
        setTimeout(triggerScan, 1000);
    };
</script>

</body>
</html>
