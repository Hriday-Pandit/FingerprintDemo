<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Biometric Matcher</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1c2541;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #4ea8de; margin-bottom: 5px; }
        p { color: #abc4ff; font-size: 13px; margin-bottom: 25px; }
        .btn {
            background-color: #3a86c8;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .btn-verify { background-color: #70e000; color: #000; }
        #result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }
        .info { background-color: #3a86c822; color: #abc4ff; border: 1px solid #3a86c8; display: block; }
        .success { background-color: #38b00022; color: #70e000; border: 1px solid #38b000; display: block; }
        .error { background-color: #d9042922; color: #ef233c; border: 1px solid #d90429; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Hardware Biometric Test</h2>
    <p>This code triggers real phone hardware and validates fingerprints</p>
    
    <button class="btn" onclick="registerRealFinger()">1. Register (Use Thumb 👍)</button>
    <button class="btn btn-verify" onclick="verifyRealFinger()">2. Verify (Test Same vs Different Finger)</button>
    
    <div id="result-box"></div>
</div>

<script>
    function strToBuf(str) { return Uint8Array.from(str, c => c.charCodeAt(0)); }
    function bufToB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

    function showResult(msg, type) {
        const box = document.getElementById('result-box');
        box.innerText = msg;
        box.className = type;
    }

    // 1. असली हार्डवेयर से उंगली रजिस्टर करना
    async function registerRealFinger() {
        if (!window.PublicKeyCredential) {
            showResult("WebAuthn not supported!", "error");
            return;
        }

        const options = {
            publicKey: {
                challenge: strToBuf("reg_challenge"),
                rp: { name: "Real Match Test", id: window.location.hostname },
                user: { id: strToBuf("user_1"), name: "test@test.com", displayName: "Tester" },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                timeout: 60000
            }
        };

        try {
            showResult("Triggering Scanner... Touch with Thumb!", "info");
            const credential = await navigator.credentials.create(options);
            
            // क्रेडेंशियल की आईडी को लोकल सेव कर रहे हैं
            const savedId = bufToB64(credential.rawId);
            localStorage.setItem('first_finger_id', savedId);
            
            showResult("✅ Thumb Registered successfully!\nNow click Button 2 to test matching.", "success");
        } catch (err) {
            showResult("Failed: " + err.message, "error");
        }
    }

    // 2. असली हार्डवेयर से वेरीफाई और मैच चेक करना
    async function verifyRealFinger() {
        const savedId = localStorage.getItem('first_finger_id');
        if (!savedId) {
            showResult("❌ Please register using Button 1 first!", "error");
            return;
        }

        // नया चैलेंज भेजकर दोबारा स्कैनर ऑन करना ताकि नई की (Key) बन सके
        const options = {
            publicKey: {
                challenge: strToBuf("verify_challenge"),
                rp: { name: "Real Match Test", id: window.location.hostname },
                user: { id: strToBuf("user_1"), name: "test@test.com", displayName: "Tester" },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                timeout: 60000
            }
        };

        try {
            showResult("Triggering Scanner... Try Same or Different finger!", "info");
            const credential = await navigator.credentials.create(options);
            const currentId = bufToB64(credential.rawId);

            // क्रेडेंशियल आईडी का असली मिलान (JS स्तर पर)
            if (currentId === savedId) {
                showResult("🎉 MATCH SUCCESSFUL!\nYou used the exact same finger. Access Granted.", "success");
            } else {
                showResult("⚠️ MISMATCH DETECTED!\nYour phone accepted the finger, but the website detected it is a DIFFERENT finger! Access Denied.", "error");
            }
        } catch (err) {
            showResult("Verification Cancelled/Failed: " + err.message, "error");
        }
    }
</script>

</body>
</html>
