<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Biometric Validation</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1c2541;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h2 { color: #4ea8de; margin-bottom: 5px; }
        p { color: #abc4ff; font-size: 13px; margin-bottom: 25px; }
        .btn {
            background-color: #3a86c8;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .btn-verify { background-color: #70e000; color: #000; }
        #id-box {
            background-color: #0b132b;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            color: #e2e8f0;
            word-break: break-all;
            margin-bottom: 15px;
            border: 1px solid #334155;
            display: none;
            text-align: left;
        }
        #result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            line-height: 1.5;
        }
        .info { background-color: #3a86c822; color: #abc4ff; border: 1px solid #3a86c8; display: block; }
        .success { background-color: #38b00022; color: #70e000; border: 1px solid #38b000; display: block; }
        .error { background-color: #d9042922; color: #ef233c; border: 1px solid #d90429; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Biometric ID Validator</h2>
    <p>Register a finger and verify if the exact same finger is used</p>
    
    <button class="btn" onclick="registerFinger()">1. Register Fingerprint</button>
    <div id="id-box"></div>
    
    <button class="btn btn-verify" onclick="verifyFinger()">2. Verify Same Finger</button>
    <div id="result-box"></div>
</div>

<script>
    // एन्कोडिंग और डिकोडिंग यूटिलिटीज (WebAuthn एरे बफर्स मांगता है)
    function strToBuf(str) { return Uint8Array.from(str, c => c.charCodeAt(0)); }
    function bufToB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
    function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

    function showResult(msg, type) {
        const box = document.getElementById('result-box');
        box.innerHTML = msg;
        box.className = type;
    }

    // 1. फिंगरप्रिंट क्रेडेंशियल बनाना (रजिस्ट्रेशन)
    async function registerFinger() {
        if (!window.PublicKeyCredential) {
            showResult("WebAuthn is not supported on this device/browser.", "error");
            return;
        }

        const options = {
            publicKey: {
                challenge: strToBuf("unique_registration_challenge"),
                rp: { name: "Biometric Validation App", id: window.location.hostname },
                user: { id: strToBuf("user_id_999"), name: "user@validation.com", displayName: "Tester" },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }], // ES256
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                timeout: 60000
            }
        };

        try {
            showResult("Triggering hardware... Please touch the sensor to register.", "info");
            const credential = await navigator.credentials.create(options);
            
            // क्रेडेंशियल आईडी को बेस64 में बदलकर जावास्क्रिप्ट लोकल स्टोरेज में सेव करना
            const savedIdBase64 = bufToB64(credential.rawId);
            localStorage.setItem('saved_fingerprint_id', savedIdBase64);
            
            // स्क्रीन पर क्रेडेंशियल आईडी दिखाना
            const idBox = document.getElementById('id-box');
            idBox.innerHTML = `<strong>Registered ID:</strong><br>${savedIdBase64}`;
            idBox.style.display = 'block';
            
            showResult("✅ Fingerprint Registered Successfully!<br>ID saved in JavaScript storage. Now try to verify.", "success");
        } catch (err) {
            showResult("Registration Failed: " + err.message, "error");
        }
    }

    // 2. सेव की गई आईडी का मिलान करना (वेरिफिकेशन)
    async function verifyFinger() {
        const savedIdBase64 = localStorage.getItem('saved_fingerprint_id');
        if (!savedIdBase64) {
            showResult("❌ No fingerprint registered yet. Please click Button 1 first.", "error");
            return;
        }

        // सेव की गई आईडी को वापस एरे बफर में बदलना
        const rawId = b64ToBuf(savedIdBase64);

        const options = {
            publicKey: {
                challenge: strToBuf("unique_verification_challenge"),
                // यह लाइन मोबाइल से कहती है कि सिर्फ इसी विशिष्ट क्रेडेंशियल आईडी वाली उंगली स्वीकार करो
                allowCredentials: [{ id: rawId, type: 'public-key' }],
                userVerification: "required",
                timeout: 60000
            }
        };

        try {
            showResult("Triggering hardware... Touch the sensor to verify.", "info");
            
            // क्रेडेंशियल को कलेक्ट करना (यह मोबाइल की आंतरिक सुरक्षा से वेरिफिकेशन करवाता है)
            const assertion = await navigator.credentials.get(options);
            const currentIdBase64 = bufToB64(assertion.rawId);

            // अंतिम सुरक्षा जांच (जावास्क्रिप्ट लेवल पर आईडी मैचिंग)
            if (currentIdBase64 === savedIdBase64) {
                showResult("🎉 MATCH SUCCESSFUL!<br>Verified! You used the exact same finger that was registered.", "success");
            } else {
                showResult("⚠️ MISMATCH DETECTED!<br>The phone validated it, but it does NOT match the registered finger ID.", "error");
            }
        } catch (err) {
            // अगर मोबाइल सुरक्षा पहचान जाती है कि यह वह उंगली नहीं है जो मांगी गई थी, तो वह एरर थ्रो करेगी
            showResult("❌ VERIFICATION FAILED / MISMATCH:<br>" + err.message + "<br>(The phone rejected this finger because it doesn't match the registered ID!)", "error");
        }
    }
</script>

</body>
</html>
